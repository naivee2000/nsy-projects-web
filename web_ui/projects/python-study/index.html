<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Study App - NSY Projects</title>
  <script>
    window.setTimeout(() => window.location.replace("https://python.nsyprojects.com/"), 900);
  </script>
  <style>
    :root { color-scheme: light; --bg: #f4f6f8; --surface: #fff; --ink: #182230; --muted: #667085; --line: #d0d5dd; --primary: #175cd3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    main { width: min(980px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 0 44px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.05; }
    a { color: var(--primary); font-size: 13px; font-weight: 800; text-decoration: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .action-link { min-height: 36px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); padding: 0 12px; display: inline-flex; align-items: center; }
    .panel { display: grid; gap: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 22px; box-shadow: 0 18px 42px rgba(16, 24, 40, .08); }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    @media (max-width: 560px) { header { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Python Study App</h1>
      <div class="actions">
        <a class="action-link" href="/projects">Back to Projects</a>
        <a class="action-link" href="https://python.nsyprojects.com/">Open Study App</a>
      </div>
    </header>
    <section class="panel" aria-label="Project">
      <p>Opening the private Python practice workspace...</p>
      <p><a href="https://python.nsyprojects.com/">Continue directly</a></p>
    </section>
  </main>
</body>
</html>
