<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>装卸时间计算表 - NSY Projects</title>
  <script>
    window.setTimeout(() => window.location.replace("https://dem.nsyprojects.com/"), 900);
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --ink: #182230;
      --muted: #667085;
      --line: #d0d5dd;
      --primary: #175cd3;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }
    main {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    a {
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }
    .action-link {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .panel {
      display: grid;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 22px;
      box-shadow: 0 18px 42px rgba(16, 24, 40, 0.08);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      letter-spacing: 0;
    }
    @media (max-width: 560px) {
      header {
        align-items: start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>装卸时间计算表</h1>
      <div class="actions">
        <a class="action-link" href="/projects">Back to Projects</a>
        <a class="action-link" href="https://dem.nsyprojects.com/">Continue to DEM</a>
      </div>
    </header>
    <section class="panel" aria-label="Project">
      <p>Opening the DEM Claim Excel workflow...</p>
      <p><a href="https://dem.nsyprojects.com/">Continue directly</a></p>
    </section>
  </main>
</body>
</html>
