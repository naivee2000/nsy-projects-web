<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects - NSY Projects</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --ink: #182230;
      --muted: #667085;
      --line: #d0d5dd;
      --primary: #175cd3;
      --green: #067647;
      --amber: #b54708;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }
    main {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .account {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .account a {
      color: var(--primary);
      text-decoration: none;
    }
    .project-list {
      display: grid;
      gap: 12px;
    }
    .project {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 18px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 18px 42px rgba(16, 24, 40, 0.08);
    }
    .project:hover {
      border-color: var(--primary);
      box-shadow: 0 22px 48px rgba(16, 24, 40, 0.12);
    }
    .project-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .status {
      border-radius: 999px;
      background: #fffaeb;
      color: var(--amber);
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .status.ready {
      background: #ecfdf3;
      color: var(--green);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      letter-spacing: 0;
    }
    @media (max-width: 560px) {
      header,
      .project-top {
        align-items: start;
        flex-direction: column;
      }
      .account { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>NSY Projects</h1>
      </div>
      <div class="account">
        <a href="index.html">Home</a>
        <span id="accountStatus">Project directory</span>
        <a id="authAction" href="https://dem.nsyprojects.com/login">Sign in</a>
      </div>
    </header>
    <section class="project-list" aria-label="Projects">
      <a class="project" href="/projects/dem-claim/">
        <div class="project-top">
          <h2>装卸时间计算表</h2>
          <span id="demStatus" class="status">Login required</span>
        </div>
        <p>把装卸文件内容（PDF/PNG等格式）填入Excel模版</p>
      </a>
      <a class="project" href="/projects/car-compare/">
        <div class="project-top">
          <h2>Car Depreciation Research Tool</h2>
          <span id="carCompareStatus" class="status">Login required</span>
        </div>
        <p>Research vehicle market values, depreciation curves, and generation-change impact.</p>
      </a>
    </section>
  </main>
  <script>
    const accountStatus = document.getElementById("accountStatus");
    const authAction = document.getElementById("authAction");
    const demStatus = document.getElementById("demStatus");
    const carCompareStatus = document.getElementById("carCompareStatus");
    authAction.href = `https://dem.nsyprojects.com/login?next=${encodeURIComponent(window.location.href)}`;
    if (document.cookie.split("; ").includes("nsy_signed_in=1")) {
      accountStatus.textContent = "Signed in";
      authAction.textContent = "Sign out";
      authAction.href = `https://dem.nsyprojects.com/logout?next=${encodeURIComponent(window.location.href)}`;
      demStatus.textContent = "Available";
      demStatus.classList.add("ready");
      carCompareStatus.textContent = "Available";
      carCompareStatus.classList.add("ready");
    }
  </script>
</body>
</html>
