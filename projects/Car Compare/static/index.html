<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Compare</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Car Compare</h1>
        <p id="runStamp">Depreciation research</p>
      </div>
      <form id="searchForm" class="searchbar">
        <label for="query">Vehicle</label>
        <input id="query" name="query" autocomplete="off" />
        <label class="yearControl" for="maxAge">
          <span>Years</span>
          <input id="maxAge" name="maxAge" type="number" min="1" max="20" value="10" inputmode="numeric" />
        </label>
        <button type="submit">Research</button>
        <button type="button" id="collectButton" class="secondaryButton">Collect</button>
      </form>
    </header>

    <main class="layout">
      <section class="workspace">
        <div id="resolverPanel" class="resolverPanel"></div>
        <div class="metricRow" id="summaryMetrics"></div>
        <div class="chartShell">
          <div class="chartHead">
            <div>
              <h2 id="chartTitle">Depreciation Trend</h2>
              <p id="chartSub"></p>
            </div>
            <div class="legend">
              <span><i class="line observed"></i>Observed</span>
              <span><i class="line projected"></i>Predicted</span>
              <span><i class="dot"></i>Average</span>
            </div>
          </div>
          <svg id="chart" viewBox="0 0 980 460" role="img" aria-label="Depreciation trend chart"></svg>
        </div>

        <div class="tableBand">
          <h2>Age Buckets</h2>
          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>Age</th>
                  <th>Model Year</th>
                  <th>Type</th>
                  <th>Samples</th>
                  <th>Average</th>
                  <th>Median</th>
                  <th>Q1</th>
                  <th>Q3</th>
                  <th>YoY Loss</th>
                  <th>YoY %</th>
                  <th>Total %</th>
                </tr>
              </thead>
              <tbody id="bucketRows"></tbody>
            </table>
          </div>
        </div>

        <div class="tableBand">
          <h2>Source Evidence</h2>
          <div id="sourceEvidence" class="evidencePanel"></div>
        </div>

        <div class="tableBand">
          <h2>Collection Plan</h2>
          <div id="collectionPlan" class="planList"></div>
        </div>
      </section>

      <aside class="side">
        <section class="toolBlock">
          <h2>Collector</h2>
          <div id="collectorStatus" class="collectorStatus"></div>
        </section>

        <section class="toolBlock">
          <h2>Sources</h2>
          <div id="sourceStatus" class="sourceList"></div>
        </section>

        <section class="toolBlock">
          <h2>Capture Import</h2>
          <label for="captureSource">Source</label>
          <input id="captureSource" value="manual_browser" />
          <label for="captureUrl">URL</label>
          <input id="captureUrl" placeholder="https://..." />
          <label for="captureText">Visible text</label>
          <textarea id="captureText" rows="8"></textarea>
        </section>

        <section class="toolBlock">
          <h2>MSRP Override</h2>
          <label for="msrpPrice">Price</label>
          <input id="msrpPrice" inputmode="numeric" placeholder="86600" />
          <label for="msrpUrl">Source URL</label>
          <input id="msrpUrl" placeholder="https://..." />
        </section>
      </aside>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
